<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportify - Array Playback Queue</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #181818;
            --surface-hover: #282828;
            --primary-color: #1db954;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--surface-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 26px;
        }

        p.subtitle {
            color: var(--text-sub);
            margin-bottom: 24px;
            font-size: 14px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #222;
            color: #fff;
            font-size: 14px;
        }

        input:focus {
            outline: 1px solid var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .queue-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .queue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-hover);
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 10px;
            transition: background 0.2s;
        }

        .queue-item.active {
            border-left: 4px solid var(--primary-color);
            background: #2a2a2a;
        }

        .track-info {
            display: flex;
            flex-direction: column;
        }

        .track-index {
            font-size: 11px;
            color: var(--primary-color);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .track-title {
            font-size: 15px;
            font-weight: 500;
            margin-top: 2px;
        }

        .remove-btn {
            background: transparent;
            color: #ff5555;
            border: none;
            cursor: pointer;
            font-size: 13px;
            padding: 4px 8px;
        }

        .remove-btn:hover {
            background: rgba(255, 85, 85, 0.1);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sportify Hip-Hop Queue</h1>
        <p class="subtitle">An interactive real-world demo mapping a JavaScript memory array to a music streaming playback queue.</p>

        <div class="controls">
            <input type="text" id="trackInput" placeholder="Enter Track Title (e.g. Drake - Hotline Bling)">
            <button onclick="addTrack()">Add to Queue</button>
        </div>

        <ul id="queueList" class="queue-list">
            <!-- Dynamic elements populate here via JavaScript -->
        </ul>
    </div>

    <script>
        // Core JavaScript Array holding our queue states
        let musicQueue = [
            "Eye of the Tiger - Survivor",
            "Lose Yourself - Eminem",
            "Change - BigXthaPlug",
            "Wonder - Kanye West",
            "Churchill - Jack Harlow ft Drake"
        ];

        function renderQueue() {
            const listElement = document.getElementById('queueList');
            listElement.innerHTML = '';

            if (musicQueue.length === 0) {
                listElement.innerHTML = '<p style="color: #b3b3b3; text-align: center; padding: 20px;">Queue is currently empty.</p>';
                return;
            }

            musicQueue.forEach((track, index) => {
                const li = document.createElement('li');
                li.className = `queue-item ${index === 0 ? 'active' : ''}`;

                li.innerHTML = `
                    <div class="track-info">
                        <span class="track-index">Index [${index}] ${index === 0 ? '• Now Playing' : ''}</span>
                        <span class="track-title">${track}</span>
                    </div>
                    <button class="remove-btn" onclick="removeTrack(${index})">Remove</button>
                `;
                listElement.appendChild(li);
            });
        }

        function addTrack() {
            const input = document.getElementById('trackInput');
            const trackName = input.value.trim();

            if (trackName) {
                musicQueue.push(trackName); // Array push method
                input.value = '';
                renderQueue();
            }
        }

        function removeTrack(index) {
            musicQueue.splice(index, 1); // Array splice method to remove element at specific index
            renderQueue();
        }

        // Initial render on load
        renderQueue();
    </script>
</body>
</html>
